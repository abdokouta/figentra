# FigenTra enterprise pnpm workspace
# External dependency versions are centralized in the default catalog.
# Internal workspace packages use workspace:* and never appear in catalog.

packages:
  - apps/*
  - services/*
  - workers/*
  - packages/*
  - packages/global/*
  - packages/client/*
  - packages/nestjs/*
  - packages/areview/*
  - packages/config/*
  # Temporary test-run exclusions — apps/family, apps/portal, apps/landing-page
  # + packages/pipeline reference @stackra/{container,support} which are not yet
  # in the workspace (planned per .kiro/plans/2026-09-03-*-package.md).
  # packages/{mapped-types,metadata} carry stale @nesvel/* legacy references.
  - "!apps/family"
  - "!apps/portal"
  - "!apps/landing-page"
  - "!packages/pipeline"
  - "!packages/mapped-types"
  - "!packages/metadata"
  # services/approval references @figentra/observability + others that
  # are planned per .kiro/plans/2026-09-03-*-package.md but not yet built.
  - "!services/approval"

# =============================================================================
# Figentra configuration manifest
# =============================================================================
#
# @file .doppler.yaml
# @description This file is part of the Figentra declarative configuration
#   system. It is consumed by the appropriate build, deployment, CI, local
#   development, or release tooling. It is NOT a source of business logic.
#
# @security Secrets, private keys, credentials, access tokens, database URLs,
#   and other sensitive material MUST NOT be committed to this file. Inject
#   secrets through Doppler, CI protected variables, Wrangler secrets, or the
#   target provider's secret-management facility.
#
# @change Any schema/data change must be reviewed with the owning service and
#   the corresponding Terraform/CI/deployment generator. Generated files must
#   not become a second source of truth.
#
# @environment Environment-specific values are explicit and limited to safe
#   non-secret configuration. The canonical environments are dev, stg, and prd.
# =============================================================================

# =============================================================================
# Doppler CLI configuration — Figentra workspace root
# =============================================================================
#
# Binds this monorepo root to the `figentra-workspace` Doppler project. Every
# `doppler run --` fired from the repo root (never a subdirectory) resolves
# against this file and pulls the WORKSPACE-TOOLING secret set — never a
# deployable's runtime secrets.
#
# What lives here (workspace-tooling only)
# ----------------------------------------
#   - Turbo remote cache        TURBO_TOKEN, TURBO_TEAM,
#                               TURBO_REMOTE_CACHE_SIGNATURE_KEY
#   - Changesets + npm publish  NPM_TOKEN, GITLAB_TOKEN
#   - Terraform provider tokens CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#                               AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
#                               AWS_REGION, SUPABASE_ACCESS_TOKEN,
#                               SUPABASE_ACCESS_TOKEN, BETTER_STACK_API_TOKEN,
#                               SENTRY_AUTH_TOKEN
#   - DOPPLER_TOKEN             operator-supplied at terraform orchestration time
#
# What does NOT live here
# -----------------------
# Per-deployable runtime secrets live in each deployable's OWN `.doppler.yaml`
# — one Doppler project per deployable (AGENTS.md §Non-negotiable boundaries +
# .kiro/steering/doppler.md). The project map:
#
#     .doppler.yaml                              -> figentra-workspace
#     apps/portal/.doppler.yaml                  -> figentra-portal
#     workers/api-gateway/.doppler.yaml          -> figentra-api-gateway
#     workers/application-registry/.doppler.yaml -> figentra-application-registry
#     services/iam/.doppler.yaml                 -> figentra-iam
#     services/tenant/.doppler.yaml              -> figentra-tenant
#     services/monetization/.doppler.yaml        -> figentra-monetization
#
# All projects live in the `figentra` Doppler workplace (provision once via
# the Doppler dashboard/MCP; secrets are never committed — only these bindings).
#
# Binding this workstation
# ------------------------
#     doppler login            # once per machine, authed to the figentra workplace
#     pnpm doppler:setup       # fans out to every .doppler.yaml in the monorepo
#
# Config branches:  dev (workstations + PR) · stg (staging) · prd (production)
# Override once:    DOPPLER_CONFIG=stg doppler run -- pnpm turbo run build
#
# Governance: .kiro/steering/doppler.md · AGENTS.md (§Non-negotiable boundaries)
# =============================================================================

setup:
  project: figentra-workspace
  config: dev

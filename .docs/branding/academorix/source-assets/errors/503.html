<!doctype html>
<!--
  Academorix · error page · 503 service unavailable · maintenance
  ------------------------------------------------------------------
  Served by the edge OR the app during a scheduled maintenance
  window. Ships a countdown to the expected return time + a link to
  the status page.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>503 · Coach called a time-out · Academorix</title>
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="Academorix is briefly paused for a maintenance window. Every session, every roster, every invoice waits right where you left it."
    />
    <link rel="stylesheet" href="../_shared/tokens.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 48px 24px;
      }
      .err {
        max-width: 720px;
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 48px;
        align-items: center;
      }
      .err-code .kicker { margin: 0; }
      .err-code .code {
        font-family: var(--font-mono);
        font-weight: 600;
        font-size: clamp(96px, 12vw, 160px);
        letter-spacing: -0.06em;
        line-height: 0.9;
        color: var(--ink);
      }
      .err-code .code em { font-style: normal; color: var(--signal); }
      .err-title {
        font-size: clamp(28px, 3vw, 40px);
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1.1;
        margin: 24px 0 12px;
      }
      .err-body {
        color: var(--text-muted);
        line-height: 1.55;
        margin: 0 0 24px;
        max-width: 480px;
      }
      .err-cta { display: flex; gap: 12px; flex-wrap: wrap; }
      .err-illo {
        display: grid; place-items: center;
        aspect-ratio: 4 / 3;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-4);
        padding: 32px;
      }
      .err-illo img { width: 100%; height: auto; }

      /* countdown scoreboard */
      .clock-row {
        margin-top: 24px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        max-width: 420px;
      }
      .clock-cell {
        background: var(--ink);
        color: var(--paper);
        border-radius: var(--radius-3);
        padding: 14px 12px;
        text-align: center;
      }
      .clock-cell .value {
        font-family: var(--font-mono);
        font-weight: 600;
        font-size: 32px;
        letter-spacing: -0.03em;
        line-height: 1;
        color: var(--signal);
      }
      .clock-cell .unit {
        margin-top: 6px;
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(250, 250, 250, 0.62);
      }
      @media (max-width: 720px) {
        .err { grid-template-columns: 1fr; }
        .err-illo { order: -1; max-width: 320px; margin: 0 auto; }
      }
    </style>
  </head>
  <body>
    <main class="err" role="main">
      <section>
        <div class="err-code">
          <p class="kicker">Time-out · maintenance window</p>
          <div class="code" aria-hidden="true"><em>5</em>0<em>3</em></div>
        </div>
        <h1 class="err-title">
          Coach called a time-out.<br />Back in a minute.
        </h1>
        <p class="err-body">
          Academorix is briefly paused for a scheduled maintenance window.
          Every session, every roster, every invoice waits right where you
          left it. Nothing gets lost.
        </p>
        <div class="err-cta">
          <a class="btn btn-primary" href="/status">See system status</a>
          <a class="btn btn-ghost" href="javascript:location.reload()">Try again</a>
        </div>

        <div class="clock-row" role="timer" aria-label="Estimated return in">
          <div class="clock-cell">
            <div class="value" id="mm">03</div>
            <div class="unit">min</div>
          </div>
          <div class="clock-cell">
            <div class="value" id="ss">42</div>
            <div class="unit">sec</div>
          </div>
          <div class="clock-cell">
            <div class="value">↻</div>
            <div class="unit">auto-retry</div>
          </div>
        </div>
      </section>
      <figure class="err-illo" aria-hidden="true">
        <img src="./illustrations/503-timeout-whistle.svg" alt="" />
      </figure>
    </main>
    <script>
      /**
       * Estimated-return countdown. Consumer app injects
       * `window.__RETURN_AT__` as an ISO 8601 timestamp; the widget
       * ticks toward it and auto-reloads at zero. Falls back to a
       * static 3:42 preview when the timestamp isn't provided.
       */
      (function () {
        var mm = document.getElementById("mm");
        var ss = document.getElementById("ss");
        var target = window.__RETURN_AT__
          ? new Date(window.__RETURN_AT__).getTime()
          : Date.now() + 3 * 60 * 1000 + 42 * 1000;
        function pad(n) { return String(Math.max(0, n)).padStart(2, "0"); }
        function tick() {
          var d = Math.max(0, target - Date.now());
          if (d <= 0) { location.reload(); return; }
          var m = Math.floor(d / 60000);
          var s = Math.floor((d % 60000) / 1000);
          mm.textContent = pad(m);
          ss.textContent = pad(s);
        }
        tick();
        setInterval(tick, 1000);
      })();
    </script>
  </body>
</html>

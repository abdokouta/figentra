<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Ball missing the hoop · 404 not found">
  <style>
    svg { color: #141414; }
    @media (prefers-color-scheme: dark) {
      svg { color: #fafafa; }
    }
  </style>
  <!--
    404-missed-shot · basketball missing rim
    Ball motion-trail arcs from bottom-left, misses the rim, exits stage-right.
    Scoreboard clock stopped at 0:04 · Track Orange dot on the ball says "missed".
  -->

  <!-- Backboard + hoop -->
  <g stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="220" y="30" width="76" height="52" rx="4"/>
    <rect x="240" y="46" width="36" height="24"/>
    <line x1="258" y1="82" x2="258" y2="92"/>
  </g>
  <!-- Rim -->
  <ellipse cx="258" cy="98" rx="18" ry="4" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <!-- Net (dashed) -->
  <g stroke="currentColor" stroke-width="1" stroke-dasharray="2 3" opacity="0.55" fill="none">
    <line x1="242" y1="98" x2="248" y2="118"/>
    <line x1="248" y1="98" x2="252" y2="120"/>
    <line x1="256" y1="98" x2="256" y2="122"/>
    <line x1="264" y1="98" x2="264" y2="122"/>
    <line x1="270" y1="98" x2="266" y2="120"/>
    <line x1="274" y1="98" x2="268" y2="118"/>
  </g>

  <!-- Motion trail · dashed arc from lower-left up + past the rim -->
  <path d="M 40 210 Q 130 30 300 60"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-dasharray="4 6"
        opacity="0.4"/>

  <!-- Ball · airborne past the rim -->
  <g transform="translate(298, 62)">
    <circle r="14" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <path d="M -14 0 Q 0 -6 14 0" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M -14 0 Q 0 6 14 0" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <line x1="0" y1="-14" x2="0" y2="14" stroke="currentColor" stroke-width="1.5"/>
    <!-- Track Orange missed dot -->
    <circle r="4" fill="#FF6B35"/>
  </g>

  <!-- Scoreboard chip · bottom left · "0:04" frozen -->
  <g transform="translate(20, 190)">
    <rect x="0" y="0" width="72" height="34" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="36" y="22" font-family="Geist Mono, ui-monospace, monospace" font-size="15" font-weight="600" text-anchor="middle" fill="currentColor" letter-spacing="-0.03em">0:04</text>
  </g>

  <!-- Off-target indicator · Track Orange arrow past hoop -->
  <g transform="translate(298, 92)">
    <path d="M 0 0 L 12 0 L 12 -4 L 20 4 L 12 12 L 12 8 L 0 8 Z" fill="#FF6B35"/>
  </g>
</svg>

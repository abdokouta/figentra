<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Locked locker · 403 forbidden">
  <style>
    svg { color: #141414; }
    @media (prefers-color-scheme: dark) {
      svg { color: #fafafa; }
    }
  </style>
  <!--
    403-locker-locked · row of locker doors, one Track Orange padlocked
    Coach + parent + athlete each get their own locker; this one is
    coach-only. Track Orange padlock says "you're not on the roster
    for this room".
  -->

  <!-- Locker row (3 lockers) -->
  <g stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="40"  y="40" width="70" height="180" rx="6"/>
    <rect x="125" y="40" width="70" height="180" rx="6"/>
    <rect x="210" y="40" width="70" height="180" rx="6"/>

    <!-- Vent slits (top of each locker) -->
    <line x1="55"  y1="52" x2="95"  y2="52"/>
    <line x1="55"  y1="58" x2="95"  y2="58"/>
    <line x1="140" y1="52" x2="180" y2="52"/>
    <line x1="140" y1="58" x2="180" y2="58"/>
    <line x1="225" y1="52" x2="265" y2="52"/>
    <line x1="225" y1="58" x2="265" y2="58"/>

    <!-- Name plates -->
    <rect x="52"  y="72" width="46" height="14" rx="2"/>
    <rect x="137" y="72" width="46" height="14" rx="2"/>
    <rect x="222" y="72" width="46" height="14" rx="2"/>

    <!-- Handles -->
    <rect x="86"  y="140" width="6" height="16" fill="currentColor"/>
    <rect x="171" y="140" width="6" height="16" fill="currentColor"/>
    <rect x="256" y="140" width="6" height="16" fill="currentColor"/>
  </g>

  <!-- Name plate labels (mono) -->
  <g font-family="Geist Mono, ui-monospace, monospace" font-size="8" fill="currentColor" text-anchor="middle" letter-spacing="0.14em" opacity="0.75">
    <text x="75"  y="82">PARENT</text>
    <text x="160" y="82">ATHLETE</text>
    <text x="245" y="82">COACH</text>
  </g>

  <!-- Track Orange padlock on the middle (athlete) locker -->
  <g transform="translate(160, 140)">
    <!-- Shackle -->
    <path d="M -14 -2 L -14 -12 A 14 14 0 0 1 14 -12 L 14 -2"
          fill="none" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="-16" y="-4" width="32" height="26" rx="4" fill="#FF6B35"/>
    <!-- Keyhole -->
    <circle cx="0" cy="6" r="3" fill="currentColor"/>
    <rect x="-1.5" y="6" width="3" height="8" fill="currentColor"/>
  </g>

  <!-- Status kicker · bottom -->
  <g transform="translate(40, 232)">
    <text x="0" y="0" font-family="Geist Mono, ui-monospace, monospace" font-size="10" fill="currentColor" letter-spacing="0.16em" opacity="0.6">ACCESS · COACH TIER ONLY</text>
  </g>
</svg>

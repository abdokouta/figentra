<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Empty scoreboard with waiting chevrons">
  <style>
    svg { color: #141414; }
    @media (prefers-color-scheme: dark) {
      svg { color: #fafafa; }
    }
  </style>
  <!--
    empty-state · scoreboard-empty
    Per docs/brand/academorix/05-illustration-library.md §2.2
    Scoreboard reads "nothing recorded yet"; chevrons signal "next up".
    Middle chevron in Track Orange (#FF6B35) draws the eye to the action.
  -->

  <!-- Three chevrons waiting above (staggered) -->
  <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 132 40 L 144 28 L 156 40"/>
    <path d="M 176 40 L 188 28 L 200 40"/>
  </g>
  <path d="M 154 60 L 168 46 L 182 60" fill="none" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Scoreboard body -->
  <rect x="60" y="88" width="200" height="112" rx="12" fill="none" stroke="currentColor" stroke-width="2.5"/>

  <!-- Divider between the two number panels -->
  <line x1="160" y1="104" x2="160" y2="184" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3" opacity="0.4"/>

  <!-- Score digits — "00 : 00" -->
  <g fill="currentColor" font-family="Geist Mono, ui-monospace, monospace" font-size="56" font-weight="600" text-anchor="middle" dominant-baseline="central">
    <text x="110" y="144">00</text>
    <text x="210" y="144">00</text>
  </g>

  <!-- Colon dots -->
  <g fill="currentColor" opacity="0.6">
    <circle cx="160" cy="128" r="3"/>
    <circle cx="160" cy="160" r="3"/>
  </g>
</svg>

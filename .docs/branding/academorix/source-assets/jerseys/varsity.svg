<?xml version="1.0" encoding="UTF-8"?>
<!--
  Academorix · jersey typography · varsity · 0-9
  ==================================================================
  Classic collegiate slab-serif with a tackle-twill inline. Uses
  Bungee Inline from Google Fonts — its native inline treatment
  matches the tackle-twill applique twill-on-jersey look without
  requiring a hand-vectorised custom glyph set.

  Fallback fonts (in order): "Rye" (Google Fonts alt) · serif.
  Track Orange fills the inline; ink fills the outer contour.

  Usage: consumers substitute Bungee Inline with a licensed varsity
  font (e.g. Bulldog Sans, Champion Gothic Featherweight) before
  going to print for large-format screen-printing.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 480"
     width="1600" height="480"
     role="img"
     aria-label="Varsity jersey numerals 0 through 9">
  <style>
    svg { color: #141414; }
    @media (prefers-color-scheme: dark) {
      svg { color: #fafafa; }
    }
  </style>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Bungee+Inline&amp;family=Geist:wght@500;600&amp;family=Geist+Mono:wght@500&amp;display=swap");
    .paper { fill: #fafafa; }
    .kicker {
      font-family: "Geist Mono", ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      fill: #FF6B35;
    }
    .caption {
      font-family: "Geist", "Inter", sans-serif;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: -0.02em;
      fill: #141414;
    }
    .meta {
      font-family: "Geist Mono", ui-monospace, monospace;
      font-size: 11px;
      fill: #141414;
      opacity: 0.62;
    }
    .digit {
      font-family: "Bungee Inline", "Rye", serif;
      font-size: 180px;
      fill: #FF6B35;
      dominant-baseline: alphabetic;
      text-anchor: middle;
    }
    .digit-label {
      font-family: "Geist Mono", ui-monospace, monospace;
      font-size: 11px;
      fill: #141414;
      opacity: 0.5;
      text-anchor: middle;
      letter-spacing: 0.12em;
    }
  </style>

  <!-- Paper background -->
  <rect class="paper" x="0" y="0" width="1600" height="480"/>

  <!-- Header -->
  <text x="48" y="42" class="kicker">Jersey typography · varsity</text>
  <text x="48" y="82" class="caption">Bungee Inline · tackle-twill effect · 0 – 9</text>
  <text x="48" y="106" class="meta">Print target · Pantone 165 C (Track Orange) inline · Pantone Black 6 C outer</text>

  <!-- Baseline rule for the specimen strip -->
  <line x1="48" y1="380" x2="1552" y2="380" stroke="currentColor" stroke-width="0.5" opacity="0.24"/>
  <!-- Track Orange base bar · one of the varsity conventions -->
  <rect x="48" y="380" width="1504" height="4" fill="#FF6B35"/>

  <!-- Digits · centered on 150px column pitch, first at 130 -->
  <g class="digit-row">
    <text class="digit" x="130"  y="380">0</text>
    <text class="digit" x="280"  y="380">1</text>
    <text class="digit" x="430"  y="380">2</text>
    <text class="digit" x="580"  y="380">3</text>
    <text class="digit" x="730"  y="380">4</text>
    <text class="digit" x="880"  y="380">5</text>
    <text class="digit" x="1030" y="380">6</text>
    <text class="digit" x="1180" y="380">7</text>
    <text class="digit" x="1330" y="380">8</text>
    <text class="digit" x="1480" y="380">9</text>
  </g>

  <!-- Column labels · mono ink caption -->
  <g class="digit-labels">
    <text class="digit-label" x="130"  y="418">0 / ZERO</text>
    <text class="digit-label" x="280"  y="418">1 / ONE</text>
    <text class="digit-label" x="430"  y="418">2 / TWO</text>
    <text class="digit-label" x="580"  y="418">3 / THREE</text>
    <text class="digit-label" x="730"  y="418">4 / FOUR</text>
    <text class="digit-label" x="880"  y="418">5 / FIVE</text>
    <text class="digit-label" x="1030" y="418">6 / SIX</text>
    <text class="digit-label" x="1180" y="418">7 / SEVEN</text>
    <text class="digit-label" x="1330" y="418">8 / EIGHT</text>
    <text class="digit-label" x="1480" y="418">9 / NINE</text>
  </g>

  <!-- Footer note · print notes -->
  <text x="48" y="462" class="meta">
    Cap height 180 · min stroke 12 mm at print (survives washing) · use for jersey backs, roster boards, trophy plaques.
  </text>

  <!-- Corner mark · A-Chevron mini -->
  <g transform="translate(1500, 30) scale(0.4)">
    <line x1="60" y1="24" x2="30" y2="96" stroke="currentColor" stroke-width="10" stroke-linecap="square"/>
    <line x1="60" y1="24" x2="90" y2="96" stroke="currentColor" stroke-width="10" stroke-linecap="square"/>
    <rect x="40" y="60" width="40" height="10" fill="currentColor"/>
    <rect x="56" y="14" width="8" height="6" fill="#FF6B35"/>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!--
  Academorix · jersey typography · modern · 0-9
  ==================================================================
  Geist-derived athletic. Uses Geist weight 700 with slight tracking
  expansion to give it jersey presence without leaving the workspace
  type family. This is the DEFAULT jersey type — matches every
  scoreboard readout + timer + roster header in the product.

  Track Orange corner accent nicks the "0" — echoes the A-Chevron
  apex marker treatment on b-mark.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 480"
     width="1600" height="480"
     role="img"
     aria-label="Modern jersey numerals 0 through 9">
  <style>
    svg { color: #141414; }
    @media (prefers-color-scheme: dark) {
      svg { color: #fafafa; }
    }
  </style>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Geist:wght@500;700;800&amp;family=Geist+Mono:wght@500&amp;display=swap");
    .paper { fill: #fafafa; }
    .kicker {
      font-family: "Geist Mono", ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      fill: #FF6B35;
    }
    .caption {
      font-family: "Geist", "Inter", sans-serif;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: -0.02em;
      fill: #141414;
    }
    .meta {
      font-family: "Geist Mono", ui-monospace, monospace;
      font-size: 11px;
      fill: #141414;
      opacity: 0.62;
    }
    .digit {
      font-family: "Geist", "Inter", sans-serif;
      font-weight: 800;
      font-size: 200px;
      fill: #141414;
      dominant-baseline: alphabetic;
      text-anchor: middle;
      letter-spacing: -0.04em;
    }
    .digit-label {
      font-family: "Geist Mono", ui-monospace, monospace;
      font-size: 11px;
      fill: #141414;
      opacity: 0.5;
      text-anchor: middle;
      letter-spacing: 0.12em;
    }
  </style>

  <!-- Paper -->
  <rect class="paper" x="0" y="0" width="1600" height="480"/>

  <!-- Header -->
  <text x="48" y="42" class="kicker">Jersey typography · modern · workspace default</text>
  <text x="48" y="82" class="caption">Geist 800 · Academorix athletic · 0 – 9</text>
  <text x="48" y="106" class="meta">Print target · Pantone Black 6 C solid · Track Orange nick on the 0 (mirror of the A-Chevron apex marker)</text>

  <!-- Track Orange baseline bar -->
  <rect x="48" y="380" width="1504" height="4" fill="#FF6B35"/>

  <!-- Digits -->
  <g class="digit-row">
    <text class="digit" x="130"  y="380">0</text>
    <text class="digit" x="280"  y="380">1</text>
    <text class="digit" x="430"  y="380">2</text>
    <text class="digit" x="580"  y="380">3</text>
    <text class="digit" x="730"  y="380">4</text>
    <text class="digit" x="880"  y="380">5</text>
    <text class="digit" x="1030" y="380">6</text>
    <text class="digit" x="1180" y="380">7</text>
    <text class="digit" x="1330" y="380">8</text>
    <text class="digit" x="1480" y="380">9</text>
  </g>

  <!-- Track Orange nick on the 0 · upper-right corner · rank-marker mirror -->
  <rect x="146" y="212" width="14" height="8" fill="#FF6B35"/>

  <!-- Column labels -->
  <g class="digit-labels">
    <text class="digit-label" x="130"  y="418">0 / ZERO</text>
    <text class="digit-label" x="280"  y="418">1 / ONE</text>
    <text class="digit-label" x="430"  y="418">2 / TWO</text>
    <text class="digit-label" x="580"  y="418">3 / THREE</text>
    <text class="digit-label" x="730"  y="418">4 / FOUR</text>
    <text class="digit-label" x="880"  y="418">5 / FIVE</text>
    <text class="digit-label" x="1030" y="418">6 / SIX</text>
    <text class="digit-label" x="1180" y="418">7 / SEVEN</text>
    <text class="digit-label" x="1330" y="418">8 / EIGHT</text>
    <text class="digit-label" x="1480" y="418">9 / NINE</text>
  </g>

  <!-- Footer -->
  <text x="48" y="462" class="meta">
    Cap height 200 · nick placement + 16, - 60 from digit center · scales linearly for jersey back / roster board / trophy plaque.
  </text>

  <!-- A-Chevron mini · corner -->
  <g transform="translate(1500, 30) scale(0.4)">
    <line x1="60" y1="24" x2="30" y2="96" stroke="currentColor" stroke-width="10" stroke-linecap="square"/>
    <line x1="60" y1="24" x2="90" y2="96" stroke="currentColor" stroke-width="10" stroke-linecap="square"/>
    <rect x="40" y="60" width="40" height="10" fill="currentColor"/>
    <rect x="56" y="14" width="8" height="6" fill="#FF6B35"/>
  </g>
</svg>

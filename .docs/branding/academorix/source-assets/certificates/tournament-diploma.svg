<?xml version="1.0" encoding="UTF-8"?>
<!--
  Academorix · diploma · tournament · A4 landscape
  ==================================================================
  Awarded to every athlete at the end of a tournament. Same shape
  covers 1st / 2nd / 3rd + participation — the 1 slot swaps
  the medal ribbon colour + the position label.

  Variable slots:
    Amir Belaid     e.g. "Aya Bensaid"
    Sahara Regional Cup    e.g. "Ain Diab Open"
    12th Edition e.g. "14th edition · 2026"
    Padel · Doubles         e.g. "Padel · Youth U14 · doubles"
    1              one of "1st" · "2nd" · "3rd" · "Participation"
    1st Place        e.g. "GOLD · CHAMPION" · "SILVER · RUNNER-UP" · "BRONZE" · "PARTICIPANT"
    #ff6b35        hex · matches place · Track Orange for GOLD is the workspace convention
    6-4 · 6-3          e.g. "6-4 · 6-3" · omit for participation with `-`
    18 Sep 26    e.g. "22 · 23 September 2026"
    Rabat Padel Club · CT-3              e.g. "Sahara Padel · Ain Diab"
    Nadia Karboub       e.g. "Karim Bennani"
    Head Referee  e.g. "Head referee · WPT · IPTA"
    Sahara Padel Federation          e.g. "Layla Farid"
    Tournament Director     e.g. "Tournament director · Sahara Padel Academy"
    GRD-2026-000247          e.g. "AXT-2026-09-0142"

  reviewed_by: null · pending Founding Partner sign-off.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1188 840"
     width="297mm" height="210mm"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-label="Tournament diploma">
  <style>
    svg { color: #141414; }
    @media (prefers-color-scheme: dark) {
      svg { color: #fafafa; }
    }
  </style>

  <style>
    .body { font-family: "Geist", "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .display { font-family: "Geist", "Inter", sans-serif; font-weight: 500; letter-spacing: -0.03em; }
    .kicker { font-family: "Geist Mono", ui-monospace, monospace; letter-spacing: 0.16em; text-transform: uppercase; }
  </style>

  <!-- ── paper ────────────────────────────────────────────── -->
  <rect x="0" y="0" width="1188" height="840" fill="#fafafa"/>

  <!-- ── chevron-lane texture ────────────────────────────── -->
  <g opacity="0.04">
    <defs>
      <pattern id="chev-tile-2" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <path d="M 8 20 L 16 12 L 24 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </pattern>
    </defs>
    <rect x="60" y="60" width="1068" height="720" fill="url(#chev-tile-2)"/>
  </g>

  <!-- ── outer border ─────────────────────────────────────── -->
  <rect x="48" y="48" width="1092" height="744" fill="none" stroke="currentColor" stroke-width="2"/>
  <rect x="56" y="56" width="1076" height="728" fill="none" stroke="currentColor" stroke-width="0.5"/>
  <g fill="#FF6B35">
    <rect x="48"   y="48"  width="24" height="4"/>
    <rect x="48"   y="48"  width="4"  height="24"/>
    <rect x="1116" y="48"  width="24" height="4"/>
    <rect x="1136" y="48"  width="4"  height="24"/>
    <rect x="48"   y="788" width="24" height="4"/>
    <rect x="48"   y="768" width="4"  height="24"/>
    <rect x="1116" y="788" width="24" height="4"/>
    <rect x="1136" y="768" width="4"  height="24"/>
  </g>

  <!-- ── mark · smaller · top-left aligned ──────────────── -->
  <g transform="translate(96, 86) scale(0.5)">
    <line x1="60" y1="24" x2="30" y2="96" stroke="currentColor" stroke-width="10" stroke-linecap="square"/>
    <line x1="60" y1="24" x2="90" y2="96" stroke="currentColor" stroke-width="10" stroke-linecap="square"/>
    <rect x="40" y="60" width="40" height="10" fill="currentColor"/>
    <rect x="56" y="14" width="8" height="6" fill="#FF6B35"/>
  </g>
  <text x="164" y="128" class="mono" font-size="11" fill="currentColor" opacity="0.62" letter-spacing="0.2em">ACADEMORIX · TOURNAMENT DIPLOMA</text>

  <!-- ── tournament title · top-right kicker ─────────────── -->
  <g transform="translate(1092, 108)">
    <text x="0" y="0" text-anchor="end" class="kicker" font-size="12" fill="#FF6B35">TOURNAMENT</text>
    <text x="0" y="24" text-anchor="end" class="display" font-size="22" fill="currentColor">Sahara Regional Cup</text>
    <text x="0" y="48" text-anchor="end" class="mono" font-size="11" fill="currentColor" opacity="0.62" letter-spacing="0.12em">12th Edition</text>
  </g>

  <!-- ── decorative rule under masthead ──────────────────── -->
  <line x1="96" y1="188" x2="1092" y2="188" stroke="currentColor" stroke-width="0.8" opacity="0.24"/>

  <!-- ── medal ribbon · left · big Track Orange bar (GOLD is #FF6B35 · SILVER #6a6a6a · BRONZE #a25a2b · PARTICIPATION #141414) ── -->
  <g transform="translate(120, 240)">
    <!-- Ribbon body -->
    <path d="M 0 0 L 148 0 L 148 240 L 74 200 L 0 240 Z"
          fill="#ff6b35"
          stroke="currentColor"
          stroke-width="1"/>
    <!-- Inner shadow · ink at 12% -->
    <path d="M 0 0 L 148 0 L 148 240 L 74 200 L 0 240 Z"
          fill="none"
          stroke="rgba(20, 20, 20, 0.32)"
          stroke-width="0.5"/>
    <!-- Place label -->
    <text x="74" y="88" text-anchor="middle" class="display" font-size="56" fill="#fafafa" letter-spacing="-0.04em">1</text>
    <text x="74" y="128" text-anchor="middle" class="mono" font-size="11" fill="#fafafa" opacity="0.86" letter-spacing="0.14em">1st Place</text>
    <!-- A-Chevron mini · inside the ribbon -->
    <g transform="translate(58, 154)">
      <line x1="16" y1="0"  x2="0"  y2="34" stroke="#fafafa" stroke-width="3.5" stroke-linecap="square"/>
      <line x1="16" y1="0"  x2="32" y2="34" stroke="#fafafa" stroke-width="3.5" stroke-linecap="square"/>
      <rect x="10" y="18" width="12" height="3.5" fill="#fafafa"/>
    </g>
  </g>

  <!-- ── recipient block · right of ribbon ───────────────── -->
  <g transform="translate(320, 262)">
    <text x="0" y="0" class="mono" font-size="11" fill="currentColor" opacity="0.62" letter-spacing="0.2em">AWARDED TO</text>
    <text x="0" y="80" class="display" font-size="60" fill="currentColor">Amir Belaid</text>
    <text x="0" y="116" class="body" font-size="16" fill="currentColor" opacity="0.72">
      for placing <tspan font-weight="500" opacity="1">1</tspan>
      in the <tspan font-weight="500" opacity="1">Padel · Doubles</tspan> bracket
    </text>
    <text x="0" y="140" class="body" font-size="15" fill="currentColor" opacity="0.62">
      Final scoreline · <tspan font-weight="500" opacity="1" class="mono">6-4 · 6-3</tspan>
    </text>
    <text x="0" y="164" class="body" font-size="14" fill="currentColor" opacity="0.5">
      18 Sep 26 · Rabat Padel Club · CT-3
    </text>

    <!-- Track Orange rule under body -->
    <rect x="0" y="196" width="48" height="4" fill="#FF6B35"/>
  </g>

  <!-- ── signatures ──────────────────────────────────────── -->
  <g transform="translate(320, 640)">
    <line x1="0" y1="0" x2="280" y2="0" stroke="currentColor" stroke-width="1"/>
    <text x="140" y="24" text-anchor="middle" class="body" font-size="15" font-weight="500" fill="currentColor">Nadia Karboub</text>
    <text x="140" y="44" text-anchor="middle" class="mono" font-size="10" fill="currentColor" opacity="0.62" letter-spacing="0.14em">Head Referee</text>
  </g>
  <g transform="translate(720, 640)">
    <line x1="0" y1="0" x2="280" y2="0" stroke="currentColor" stroke-width="1"/>
    <text x="140" y="24" text-anchor="middle" class="body" font-size="15" font-weight="500" fill="currentColor">Sahara Padel Federation</text>
    <text x="140" y="44" text-anchor="middle" class="mono" font-size="10" fill="currentColor" opacity="0.62" letter-spacing="0.14em">Tournament Director</text>
  </g>

  <!-- ── serial + verify ─────────────────────────────────── -->
  <g transform="translate(72, 750)">
    <text x="0" y="0" class="mono" font-size="10" fill="currentColor" opacity="0.62" letter-spacing="0.16em">SERIAL</text>
    <text x="0" y="18" class="mono" font-size="13" fill="currentColor" font-weight="500">GRD-2026-000247</text>
  </g>
  <text x="1116" y="768" text-anchor="end" class="mono" font-size="9" fill="currentColor" opacity="0.5" letter-spacing="0.14em">VERIFY · ACADEMORIX.COM/VERIFY/GRD-2026-000247</text>
</svg>

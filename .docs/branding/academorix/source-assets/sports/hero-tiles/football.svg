<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sport HERO tile — football (soccer).
  Full pitch top-down · 16:10 · ink surface + Track Orange linework.
  Improves on landing's SportVector by: HD viewBox (800×500),
  correct pitch proportions (105:68 ~= 1.54 mapped to 3:2 tolerant),
  full pitch anatomy (goal areas, corner arcs, penalty spots),
  brand-consistent color story (no per-sport rainbow).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Football pitch — top-down">
  <defs>
    <style>
      .field { fill: #141414; }
      .line { fill: none; stroke: #FF6B35; stroke-width: 3; stroke-linejoin: miter; opacity: 0.9; }
      .line-thin { fill: none; stroke: #FF6B35; stroke-width: 2; stroke-linejoin: miter; opacity: 0.6; }
      .dot { fill: #FF6B35; }
    </style>
  </defs>

  <!-- Field surface -->
  <rect width="800" height="500" class="field"/>

  <!-- Pitch outline (with 40px margin all around) -->
  <rect x="40" y="40" width="720" height="420" class="line"/>

  <!-- Halfway line -->
  <line x1="400" y1="40" x2="400" y2="460" class="line"/>

  <!-- Center circle + spot -->
  <circle cx="400" cy="250" r="70" class="line"/>
  <circle cx="400" cy="250" r="3" class="dot"/>

  <!-- LEFT half — penalty box (18-yard box) -->
  <rect x="40" y="140" width="120" height="220" class="line"/>
  <!-- Goal area (6-yard box) -->
  <rect x="40" y="200" width="52" height="100" class="line-thin"/>
  <!-- Penalty spot -->
  <circle cx="130" cy="250" r="3" class="dot"/>
  <!-- Penalty D (arc facing outward, only the visible part outside the box) -->
  <path d="M 160 218 A 40 40 0 0 1 160 282" class="line-thin"/>
  <!-- Goal (12 units wide behind the goal-line) -->
  <line x1="40" y1="230" x2="26" y2="230" class="line"/>
  <line x1="40" y1="270" x2="26" y2="270" class="line"/>
  <line x1="26" y1="230" x2="26" y2="270" class="line"/>

  <!-- RIGHT half — penalty box (mirror) -->
  <rect x="640" y="140" width="120" height="220" class="line"/>
  <rect x="708" y="200" width="52" height="100" class="line-thin"/>
  <circle cx="670" cy="250" r="3" class="dot"/>
  <path d="M 640 218 A 40 40 0 0 0 640 282" class="line-thin"/>
  <line x1="760" y1="230" x2="774" y2="230" class="line"/>
  <line x1="760" y1="270" x2="774" y2="270" class="line"/>
  <line x1="774" y1="230" x2="774" y2="270" class="line"/>

  <!-- Corner arcs (all four) -->
  <path d="M 40 52 A 12 12 0 0 1 52 40" class="line-thin"/>
  <path d="M 748 40 A 12 12 0 0 1 760 52" class="line-thin"/>
  <path d="M 40 448 A 12 12 0 0 0 52 460" class="line-thin"/>
  <path d="M 748 460 A 12 12 0 0 0 760 448" class="line-thin"/>
</svg>

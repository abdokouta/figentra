<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Swimming pool diagram">
  <style>
    svg { color: #141414; }
    @media (prefers-color-scheme: dark) {
      svg { color: #fafafa; }
    }
  </style>
  <title>Swimming pool</title>
  <desc>Line-art 50m Olympic swimming pool — 8 lanes with lane rope dividers, start blocks, turn walls, and 5m/15m markers. Track Orange accent on start blocks + finish touch pad. Academorix v0.1.</desc>

  <!-- Pool outer -->
  <rect x="20" y="40" width="760" height="320" rx="2"/>

  <!-- 8 lanes (7 dividers) -->
  <line x1="20" y1="80" x2="780" y2="80" stroke-dasharray="12 6"/>
  <line x1="20" y1="120" x2="780" y2="120" stroke-dasharray="12 6"/>
  <line x1="20" y1="160" x2="780" y2="160" stroke-dasharray="12 6"/>
  <line x1="20" y1="200" x2="780" y2="200" stroke-dasharray="12 6"/>
  <line x1="20" y1="240" x2="780" y2="240" stroke-dasharray="12 6"/>
  <line x1="20" y1="280" x2="780" y2="280" stroke-dasharray="12 6"/>
  <line x1="20" y1="320" x2="780" y2="320" stroke-dasharray="12 6"/>

  <!-- Start walls (left = start blocks side) -->
  <rect x="4" y="40" width="16" height="320" fill="#FF6B35" stroke="none" opacity="0.9"/>
  <!-- Finish touch pad (right) -->
  <rect x="780" y="40" width="16" height="320" fill="currentColor" stroke="none" opacity="0.85"/>

  <!-- 15m marker (backstroke flag position) — subtle dashed -->
  <line x1="245" y1="30" x2="245" y2="370" stroke-dasharray="4 6" opacity="0.5"/>
  <line x1="555" y1="30" x2="555" y2="370" stroke-dasharray="4 6" opacity="0.5"/>

  <!-- 5m marker (turn zone) -->
  <line x1="145" y1="30" x2="145" y2="370" stroke-dasharray="2 8" opacity="0.35"/>
  <line x1="655" y1="30" x2="655" y2="370" stroke-dasharray="2 8" opacity="0.35"/>

  <!-- Lane number dots (subtle, left side) -->
  <circle cx="30" cy="60" r="2" fill="currentColor" stroke="none"/>
  <circle cx="30" cy="100" r="2" fill="currentColor" stroke="none"/>
  <circle cx="30" cy="140" r="2" fill="currentColor" stroke="none"/>
  <circle cx="30" cy="180" r="2" fill="currentColor" stroke="none"/>
  <circle cx="30" cy="220" r="2" fill="currentColor" stroke="none"/>
  <circle cx="30" cy="260" r="2" fill="currentColor" stroke="none"/>
  <circle cx="30" cy="300" r="2" fill="currentColor" stroke="none"/>
  <circle cx="30" cy="340" r="2" fill="currentColor" stroke="none"/>
</svg>

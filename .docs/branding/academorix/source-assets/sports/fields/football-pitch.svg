<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Football pitch diagram">
  <style>
    svg { color: #141414; }
    @media (prefers-color-scheme: dark) {
      svg { color: #fafafa; }
    }
  </style>

  <title>Football pitch</title>
  <desc>Line-art football pitch — outer touch lines, center line, center circle, both penalty areas + goal areas, penalty spots, corner arcs, and goals. Track Orange accent on the center spot + penalty spots. Academorix v0.1.</desc>

  <!-- Outer pitch -->
  <rect x="20" y="20" width="760" height="460" rx="2"/>

  <!-- Halfway line -->
  <line x1="400" y1="20" x2="400" y2="480"/>

  <!-- Center circle + spot -->
  <circle cx="400" cy="250" r="72"/>
  <circle cx="400" cy="250" r="4" fill="#FF6B35" stroke="none"/>

  <!-- Left penalty area -->
  <rect x="20" y="105" width="140" height="290"/>
  <!-- Left goal area -->
  <rect x="20" y="175" width="55" height="150"/>
  <!-- Left penalty arc -->
  <path d="M 160 214 A 72 72 0 0 1 160 286"/>
  <!-- Left penalty spot -->
  <circle cx="112" cy="250" r="3" fill="#FF6B35" stroke="none"/>
  <!-- Left goal -->
  <rect x="4" y="220" width="16" height="60" stroke-width="2"/>

  <!-- Right penalty area -->
  <rect x="640" y="105" width="140" height="290"/>
  <!-- Right goal area -->
  <rect x="725" y="175" width="55" height="150"/>
  <!-- Right penalty arc -->
  <path d="M 640 214 A 72 72 0 0 0 640 286"/>
  <!-- Right penalty spot -->
  <circle cx="688" cy="250" r="3" fill="#FF6B35" stroke="none"/>
  <!-- Right goal -->
  <rect x="780" y="220" width="16" height="60" stroke-width="2"/>

  <!-- Corner arcs -->
  <path d="M 20 30 A 10 10 0 0 1 30 20"/>
  <path d="M 770 20 A 10 10 0 0 1 780 30"/>
  <path d="M 780 470 A 10 10 0 0 1 770 480"/>
  <path d="M 30 480 A 10 10 0 0 1 20 470"/>
</svg>

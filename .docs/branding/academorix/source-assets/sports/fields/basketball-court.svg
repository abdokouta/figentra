<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Basketball court diagram">
  <style>
    svg { color: #141414; }
    @media (prefers-color-scheme: dark) {
      svg { color: #fafafa; }
    }
  </style>

  <title>Basketball court</title>
  <desc>Line-art basketball court — full court with both keys, three-point arcs, center circle, restraining circles, free-throw lanes. Track Orange accent on the center jump-ball spot + both rims. Academorix v0.1.</desc>

  <!-- Outer court -->
  <rect x="20" y="20" width="760" height="420" rx="2"/>

  <!-- Halfway line -->
  <line x1="400" y1="20" x2="400" y2="440"/>

  <!-- Center circles -->
  <circle cx="400" cy="230" r="60"/>
  <circle cx="400" cy="230" r="24"/>
  <circle cx="400" cy="230" r="4" fill="#FF6B35" stroke="none"/>

  <!-- Left key + free-throw circle -->
  <rect x="20" y="140" width="150" height="180"/>
  <circle cx="170" cy="230" r="60"/>
  <line x1="170" y1="170" x2="170" y2="290" stroke-dasharray="6 6"/>
  <!-- Left three-point arc -->
  <path d="M 20 60 L 90 60 A 220 220 0 0 1 90 400 L 20 400"/>
  <!-- Left backboard + rim -->
  <line x1="40" y1="205" x2="40" y2="255" stroke-width="3"/>
  <circle cx="52" cy="230" r="7" fill="none" stroke="#FF6B35" stroke-width="2.5"/>

  <!-- Right key + free-throw circle -->
  <rect x="630" y="140" width="150" height="180"/>
  <circle cx="630" cy="230" r="60"/>
  <line x1="630" y1="170" x2="630" y2="290" stroke-dasharray="6 6"/>
  <!-- Right three-point arc -->
  <path d="M 780 60 L 710 60 A 220 220 0 0 0 710 400 L 780 400"/>
  <!-- Right backboard + rim -->
  <line x1="760" y1="205" x2="760" y2="255" stroke-width="3"/>
  <circle cx="748" cy="230" r="7" fill="none" stroke="#FF6B35" stroke-width="2.5"/>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!--
  Academorix · provenance lockup · v1.0 · 2026-08-21

  Wordmark 'academorix' + Track Orange check-tick + "Verified"
  caption below. Vertical composition for document footers, PDF
  stamps, signed-artifact badges, certificate seals when horizontal
  space is tight.

  Codified by ADR-0104 — supersedes the pre-2026-08-21 A-Chevron
  provenance lockup (deleted alongside mark-primary.svg).

  Geometry
  ────────
  ViewBox    0 0 320 140
  Wordmark   Geist Medium 48px · baseline y=56 · letter-spacing -0.03em
  Tick       Track Orange (#FF6B35) · stroke 6px positioned right of
             the wordmark's trailing 'x'
  Caption    Geist 500 14px · letter-spacing 0.14em uppercase · centered

  Per docs/brand/academorix/05-illustration-library.md §2.6.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 320 140"
  width="320"
  height="140"
  role="img"
  aria-label="Verified · Academorix"
>
  <style>
    svg { color: #141414; }
    @media (prefers-color-scheme: dark) {
      svg { color: #fafafa; }
    }
    .wm {
      font-family: "Geist", "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      font-size: 48px;
      letter-spacing: -0.03em;
      fill: currentColor;
    }
    .cap {
      font-family: "Geist", "Inter", sans-serif;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      fill: currentColor;
    }
  </style>

  <!-- Wordmark + tick -->
  <text x="0" y="56" class="wm">academorix</text>
  <path
    d="M 268 40 L 278 50 L 296 30"
    fill="none"
    stroke="#FF6B35"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Divider hair -->
  <line x1="0" y1="90" x2="320" y2="90" stroke="currentColor" stroke-width="1" opacity="0.24"/>

  <!-- Caption -->
  <text x="160" y="118" class="cap" text-anchor="middle">Verified · Academorix</text>
</svg>

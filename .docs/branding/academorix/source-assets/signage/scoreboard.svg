<?xml version="1.0" encoding="UTF-8"?>
<!--
  Academorix · office signage · digital scoreboard
  ==================================================================
  Wall-mount scoreboard face for the academy competition hall. Ink
  panel with Geist Mono digits; Track Orange is reserved for the
  active period indicator + the clock colon (steady, no blink — per
  ADR-0104, Academorix draws a clean line from Figentra's F-Cursor
  motion library). The layout is sport-agnostic — the right-hand
  secondary counter is labelled by the driver at runtime (SHOT CLOCK
  for basketball, SERVE ADV for tennis, TIMEOUT for padel).

  Type + colour contract:
    · Wordmark         — top-left of board header (rendered inline)
    · Track Orange     — active period dot · clock colon · LIVE badge
    · Geist Mono 700   — score digits + clock (matches the product's
                         scoreboard in-app component)
    · Geist 700        — team names
    · Steady frame     — no ticker · no blink · no cursor cadence

  Variable slots (server-side substitution before drive):
    FALCONS          left team name         "FALCONS"
    23         left score              23
    SUNS          right team name        "SUNS"
    18         right score             18
    12:47              MM:SS                  "12:47"
    3      1-5 (which dot lit)     3
    5       total periods           5
    SHOT CLOCK    e.g. "SHOT CLOCK"      "SHOT CLOCK"
    24    e.g. "24"              "24"
    18 SEP 26 · SAHARA · CT-3         date · venue · court    "15 NOV 2026 · SAHARA · CT-2"

  Physical spec:
    · 2000×900mm face on 40mm-deep alu chassis
    · P3 or P4 LED module (indoor) OR e-paper for silent hall
    · 24-VDC low-voltage · driver behind 800mm-from-floor bottom edge

  Renders in a browser at 1600×900 for review.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 900"
     width="1600" height="900"
     role="img"
     aria-label="Academorix digital scoreboard · wall-mount face">
  <style>
    svg { color: #141414; }
    @media (prefers-color-scheme: dark) {
      svg { color: #fafafa; }
    }
  </style>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700;800&amp;family=Geist+Mono:wght@500;600;700&amp;display=swap");
    .title       { font-family: "Geist", "Inter", sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -0.03em; fill: #141414; }
    .subtitle    { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; fill: rgba(20,20,20,0.62); }
    .board-mark  { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; fill: rgba(250,250,250,0.72); }
    .board-meta  { font-family: "Geist Mono", ui-monospace, monospace; font-weight: 500; font-size: 11px; letter-spacing: 0.12em; fill: rgba(250,250,250,0.55); }
    .team-name   { font-family: "Geist", "Inter", sans-serif; font-weight: 700; font-size: 52px; letter-spacing: -0.02em; fill: #fafafa; }
    .score-digit { font-family: "Geist Mono", ui-monospace, monospace; font-weight: 700; font-size: 168px; letter-spacing: -0.04em; fill: #fafafa; }
    .sep         { font-family: "Geist Mono", ui-monospace, monospace; font-weight: 700; font-size: 96px; letter-spacing: 0; fill: rgba(250,250,250,0.32); }
    .clock       { font-family: "Geist Mono", ui-monospace, monospace; font-weight: 700; font-size: 128px; letter-spacing: -0.02em; fill: #fafafa; }
    .clock-colon { font-family: "Geist Mono", ui-monospace, monospace; font-weight: 700; font-size: 128px; letter-spacing: -0.02em; fill: #ff6b35; }
    .clock-cap   { font-family: "Geist Mono", ui-monospace, monospace; font-weight: 500; font-size: 12px; letter-spacing: 0.20em; text-transform: uppercase; fill: rgba(250,250,250,0.55); }
    .period-lbl  { font-family: "Geist Mono", ui-monospace, monospace; font-weight: 600; font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase; fill: rgba(250,250,250,0.72); }
    .period-cap  { font-family: "Geist", "Inter", sans-serif; font-weight: 700; font-size: 32px; letter-spacing: -0.02em; fill: #fafafa; }
    .secondary-l { font-family: "Geist Mono", ui-monospace, monospace; font-weight: 600; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; fill: rgba(250,250,250,0.72); }
    .secondary-v { font-family: "Geist Mono", ui-monospace, monospace; font-weight: 700; font-size: 72px; letter-spacing: -0.03em; fill: #fafafa; }
    .foot-meta   { font-family: "Geist Mono", ui-monospace, monospace; font-weight: 500; font-size: 12px; letter-spacing: 0.16em; fill: rgba(250,250,250,0.45); }
    .kicker      { font-family: "Geist", "Inter", sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; fill: #ff6b35; }
    .legend      { font-family: "Geist", "Inter", sans-serif; font-weight: 500; font-size: 11px; fill: rgba(20,20,20,0.72); }
    .callout     { font-family: "Geist Mono", ui-monospace, monospace; font-weight: 500; font-size: 11px; fill: rgba(20,20,20,0.72); }
    .rule        { fill: none; stroke: rgba(20,20,20,0.14); stroke-width: 1; }

    /* Steady frame · no cursor blink · Academorix motion signature */
  </style>

  <!-- ── header ────────────────────────────────────────── -->
  <text x="60" y="52" class="title">Digital scoreboard · competition hall face</text>
  <text x="60" y="78" class="subtitle">Wall-mount · LED / e-paper · sport-agnostic driver contract</text>
  <line class="rule" x1="60" y1="98" x2="1540" y2="98"/>

  <!-- ═══════════════════ THE BOARD ═══════════════════ -->
  <g transform="translate(60 130)">

    <!-- panel shadow (deeper because the panel is chassis-mounted) -->
    <rect x="10" y="14" width="1480" height="580" rx="14" fill="rgba(20,20,20,0.18)"/>

    <!-- chassis frame -->
    <rect x="0" y="0" width="1480" height="580" rx="12" fill="currentColor" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

    <!-- corner mount screws -->
    <circle cx="20" cy="20" r="4" fill="rgba(255,255,255,0.16)"/>
    <circle cx="1460" cy="20" r="4" fill="rgba(255,255,255,0.16)"/>
    <circle cx="20" cy="560" r="4" fill="rgba(255,255,255,0.16)"/>
    <circle cx="1460" cy="560" r="4" fill="rgba(255,255,255,0.16)"/>

    <!-- ── BOARD HEADER (thin top strip) ── -->
    <line x1="30" y1="70" x2="1450" y2="70" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <g transform="translate(30 22) scale(0.42)">
      <path d="M 30 90 L 60 30" stroke="#fafafa" stroke-width="10" fill="none"/>
      <path d="M 60 30 L 90 90" stroke="#fafafa" stroke-width="10" fill="none"/>
      <rect x="40" y="60" width="40" height="10" fill="#fafafa"/>
      <rect x="56" y="14" width="8" height="6" fill="#ff6b35"/>
    </g>
    <text x="90" y="48" class="board-mark">Academorix</text>
    <text x="1450" y="34" class="board-meta" text-anchor="end">MATCH · KAF-U14-1146</text>
    <text x="1450" y="54" class="board-meta" text-anchor="end">LIVE · UNOFFICIAL</text>
    <!-- live dot (Track Orange, steady) -->
    <circle cx="1160" cy="34" r="5" fill="#ff6b35"/>
    <text x="1148" y="38" class="board-meta" text-anchor="end" style="fill:rgba(250,250,250,0.72)">LIVE</text>

    <!-- ── TEAM + SCORE ROW ── -->
    <!-- home team name -->
    <text x="60" y="220" class="team-name">FALCONS</text>
    <text x="60" y="240" class="clock-cap">home</text>

    <!-- home score -->
    <text x="400" y="290" class="score-digit" text-anchor="middle">23</text>

    <!-- separator -->
    <text x="740" y="270" class="sep" text-anchor="middle">·</text>

    <!-- away score -->
    <text x="1080" y="290" class="score-digit" text-anchor="middle">18</text>

    <!-- away team name -->
    <text x="1420" y="220" class="team-name" text-anchor="end">SUNS</text>
    <text x="1420" y="240" class="clock-cap" text-anchor="end">away</text>

    <!-- ── CLOCK ROW ── -->
    <text x="740" y="410" class="clock" text-anchor="middle">
      <tspan>12</tspan><tspan class="clock-colon">:</tspan><tspan>47</tspan>
    </text>
    <text x="740" y="440" class="clock-cap" text-anchor="middle">match clock</text>

    <!-- ── PERIOD ROW ── -->
    <text x="60" y="490" class="period-lbl">Period</text>
    <!-- 5 dots -->
    <g transform="translate(60 500)">
      <!-- inactive · 1 -->
      <circle cx="16" cy="16" r="10" fill="none" stroke="rgba(250,250,250,0.32)" stroke-width="1.6"/>
      <text x="16" y="20" class="foot-meta" text-anchor="middle" style="font-size:10px; letter-spacing:0">1</text>
      <!-- inactive · 2 -->
      <circle cx="50" cy="16" r="10" fill="none" stroke="rgba(250,250,250,0.32)" stroke-width="1.6"/>
      <text x="50" y="20" class="foot-meta" text-anchor="middle" style="font-size:10px; letter-spacing:0">2</text>
      <!-- ACTIVE · 3 (Track Orange, filled) -->
      <circle cx="84" cy="16" r="10" fill="#ff6b35"/>
      <text x="84" y="20" class="foot-meta" text-anchor="middle" style="font-size:10px; letter-spacing:0; fill:#141414">3</text>
      <!-- inactive · 4 -->
      <circle cx="118" cy="16" r="10" fill="none" stroke="rgba(250,250,250,0.32)" stroke-width="1.6"/>
      <text x="118" y="20" class="foot-meta" text-anchor="middle" style="font-size:10px; letter-spacing:0">4</text>
      <!-- inactive · 5 -->
      <circle cx="152" cy="16" r="10" fill="none" stroke="rgba(250,250,250,0.32)" stroke-width="1.6"/>
      <text x="152" y="20" class="foot-meta" text-anchor="middle" style="font-size:10px; letter-spacing:0">5</text>
    </g>

    <text x="740" y="500" class="period-cap" text-anchor="middle">SET 3</text>
    <text x="740" y="522" class="clock-cap" text-anchor="middle">of 5</text>

    <text x="1420" y="490" class="secondary-l" text-anchor="end">SHOT CLOCK</text>
    <text x="1420" y="546" class="secondary-v" text-anchor="end">24</text>

    <!-- ── FOOTER STRIP ── -->
    <line x1="30" y1="558" x2="1450" y2="558" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <text x="30" y="574" class="foot-meta">18 SEP 26 · SAHARA · CT-3</text>
    <text x="1450" y="574" class="foot-meta" text-anchor="end">v1.1 · driver: STACKRA / SCOREBOARD</text>
  </g>

  <!-- ═══════════════════ LEGEND ═══════════════════ -->
  <line class="rule" x1="60" y1="750" x2="1540" y2="750"/>
  <text x="60" y="778" class="subtitle">Type + colour contract</text>

  <g transform="translate(60 794)">
    <rect fill="currentColor" x="0" y="0" width="40" height="26" rx="2"/>
    <text x="10" y="19" style="font-family:'Geist Mono',monospace; font-weight:700; font-size:20px; fill:#fafafa; letter-spacing:-0.03em">42</text>
    <text x="52" y="18" class="legend">Score · Geist Mono 700 · 168px</text>
  </g>
  <g transform="translate(400 794)">
    <rect fill="currentColor" x="0" y="0" width="60" height="26" rx="2"/>
    <text x="30" y="19" text-anchor="middle" style="font-family:'Geist Mono',monospace; font-weight:700; font-size:16px; fill:#fafafa">12:47</text>
    <text x="72" y="18" class="legend">Clock · steady Track Orange colon</text>
  </g>
  <g transform="translate(770 794)">
    <circle cx="12" cy="13" r="10" fill="#ff6b35"/>
    <text x="30" y="18" class="legend">Active period · Track Orange</text>
  </g>
  <g transform="translate(1080 794)">
    <circle cx="12" cy="13" r="10" fill="none" stroke="rgba(20,20,20,0.32)" stroke-width="1.6"/>
    <text x="30" y="18" class="legend">Inactive period · outline only</text>
  </g>

  <text x="60" y="854" class="subtitle">Driver contract</text>
  <text x="60" y="878" class="callout">Every slot is a mustache token · driver polls the match feed every 1s · scoreboard renders on P3 (indoor 3mm pitch) LED for competition hall</text>

  <text x="1540" y="890" class="callout" text-anchor="end">Academorix · scoreboard · v1.1 · Sprint 2</text>
</svg>

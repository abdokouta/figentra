<?xml version="1.0" encoding="UTF-8"?>
<!--
  Figentra × partner lockup rules · v1 · 2026-08-19.

  Reference sheet for the horizontal partner lockup — a Figentra
  f_ mark paired with a partner mark, separated by a hairline
  Signal-mint pipe (12px stroke × 44px height). Governs partner
  spec-collaterals: MSA cover pages, joint press releases,
  co-branded event backdrops, signed pilot decks.

  Anatomy (from left to right, aligned to a 44px baseline):

  ┌────────────────────────────────────────────────────────────────┐
  │ ← 24px  → f_  ← 20px  →  │  ← 20px  →  [PARTNER MARK]  ← 24px │
  └────────────────────────────────────────────────────────────────┘
       margin   fig   clear    pipe    clear     partner    margin

  Clear-space rule: the pipe divider stands 20px away from either
  mark AT MINIMUM. When the partner mark is a wordmark, the pipe
  aligns to the x-height cap; when the partner mark is a symbol,
  the pipe stands centred on the partner mark's optical centre.

  The pipe is Signal Mint (#00E5A0) — the ONLY brand accent
  permitted in a partner lockup. Partner-owned accents render on
  the partner side only.

  Refer to §11d in brand-system.html for the rules-of-use matrix
  (allowed pairings, minimum sizes, forbidden compositions).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120" role="img" aria-label="Figentra partner lockup rules · anatomy reference" color="#141414">
  <style>
    svg { color: #141414; }
    @media (prefers-color-scheme: dark) {
      svg { color: #fafafa; }
    }
  </style>

  <!-- Clear-space guide · dashed rectangle around the whole lockup -->
  <rect x="10" y="18" width="540" height="72" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.28"/>

  <!-- Left margin annotation · 24px -->
  <line x1="34" y1="90" x2="34" y2="102" stroke="currentColor" stroke-width="0.6" opacity="0.5"/>
  <text x="22" y="112" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="currentColor" opacity="0.5">24</text>

  <!-- Figentra f_ mark at scale 0.4 (48×48 optical) -->
  <g transform="translate(34, 34) scale(0.4)">
    <rect x="44" y="18" width="8" height="76" fill="currentColor"/>
    <rect x="44" y="18" width="30" height="8" fill="currentColor"/>
    <rect x="28" y="52" width="36" height="8" fill="currentColor"/>
    <rect x="28" y="102" width="64" height="8" fill="#00E5A0"/>
  </g>

  <!-- 20px clearspace annotation to the right of f_ -->
  <line x1="82" y1="90" x2="82" y2="102" stroke="currentColor" stroke-width="0.6" opacity="0.5"/>
  <line x1="102" y1="90" x2="102" y2="102" stroke="currentColor" stroke-width="0.6" opacity="0.5"/>
  <text x="86" y="112" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="currentColor" opacity="0.5">20</text>

  <!-- Signal-mint pipe divider · 2×44 -->
  <rect x="123" y="38" width="2" height="44" fill="#00E5A0"/>

  <!-- 20px clearspace annotation to the right of the pipe -->
  <line x1="125" y1="90" x2="125" y2="102" stroke="currentColor" stroke-width="0.6" opacity="0.5"/>
  <line x1="145" y1="90" x2="145" y2="102" stroke="currentColor" stroke-width="0.6" opacity="0.5"/>
  <text x="129" y="112" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="currentColor" opacity="0.5">20</text>

  <!-- Partner mark slot · dashed rectangle placeholder · scales to fit partner geometry -->
  <rect x="150" y="34" width="160" height="52" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
  <text x="230" y="56" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="currentColor" opacity="0.5" letter-spacing="0.05em">PARTNER MARK</text>
  <text x="230" y="72" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="currentColor" opacity="0.4">≤ 52 h · aspect-scaled</text>

  <!-- 24px right-margin annotation -->
  <line x1="310" y1="90" x2="310" y2="102" stroke="currentColor" stroke-width="0.6" opacity="0.5"/>
  <line x1="334" y1="90" x2="334" y2="102" stroke="currentColor" stroke-width="0.6" opacity="0.5"/>
  <text x="316" y="112" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="currentColor" opacity="0.5">24</text>

  <!-- Baseline dimension · 44 -->
  <text x="410" y="52" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="currentColor" opacity="0.5" letter-spacing="0.04em">HEIGHT · 44 px min</text>
  <text x="410" y="68" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="currentColor" opacity="0.5" letter-spacing="0.04em">CLEARSPACE · 20 px both sides</text>
  <text x="410" y="84" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="currentColor" opacity="0.5" letter-spacing="0.04em">MARGIN · 24 px outer</text>
</svg>

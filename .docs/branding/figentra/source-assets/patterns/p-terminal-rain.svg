<?xml version="1.0" encoding="UTF-8"?>
<!--
  Pattern — Terminal Rain
  Tileable 120×160. Monospace glyph fragments in Signal mint, varying
  opacity to simulate depth. Use behind AI / developer surfaces (docs,
  changelog, status pages). Font stack falls back to system monospace.
  See docs/brand/13-patterns-and-assets.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="160" viewBox="0 0 120 160" font-family="'Geist Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#00E5A0">
  <text x="10" y="18" opacity="0.55">&gt;_</text>
  <text x="10" y="42" opacity="0.32">$</text>
  <text x="10" y="66" opacity="0.22">|</text>
  <text x="10" y="98" opacity="0.44">▮</text>
  <text x="10" y="122" opacity="0.15">·</text>

  <text x="46" y="28" opacity="0.28">&#123;&#125;</text>
  <text x="46" y="58" opacity="0.5">&gt;</text>
  <text x="46" y="90" opacity="0.18">::</text>
  <text x="46" y="122" opacity="0.36">|_</text>
  <text x="46" y="146" opacity="0.22">*</text>

  <text x="86" y="20" opacity="0.4">·</text>
  <text x="86" y="50" opacity="0.28">▮</text>
  <text x="86" y="80" opacity="0.55">&gt;_</text>
  <text x="86" y="110" opacity="0.18">$</text>
  <text x="86" y="138" opacity="0.32">|</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!--
  Figentra vertical video · shape 05 · Product showcase.
  9:16 · 1080×1920. Two-pane vertical stack: product screenshot slot
  (top) + caption + CTA marker (bottom). Used for product-demo Reels
  where the shot needs to breathe and the caption anchors the ask.

  Content zones inside safe area:
    - Kicker         · 260 y · Signal-mint · mono
    - Product pane   · 320..1080 y · rounded 24 px · placeholder
                       for the actual demo capture the operator drops in
    - Caption card   · 1120..1350 y · glass surface with headline + sub
    - CTA marker     · bottom-left of caption card
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-label="Product showcase · vertical video shape template" color="#141414">
  <style>
    svg { color: #141414; }
    @media (prefers-color-scheme: dark) {
      svg { color: #fafafa; }
    }
  </style>

  <!-- Ink field -->
  <rect x="0" y="0" width="1080" height="1920" fill="#0b0f14"/>

  <!-- Top safe-zone marker -->
  <line x1="0" y1="206" x2="1080" y2="206" stroke="#fafafa" stroke-width="1" stroke-dasharray="6 6" opacity="0.14"/>

  <!-- Kicker · Signal Mint mono -->
  <text x="60" y="290" font-family="'Geist Mono', ui-monospace, monospace" font-size="28" fill="#00e5a0" letter-spacing="0.18em">
    PRODUCT · 05 · ACADEMORIX
  </text>

  <!-- Product-screenshot pane · dashed placeholder · 1000 × 720 -->
  <rect x="40" y="340" width="1000" height="720" rx="24" fill="rgba(255,255,255,0.03)" stroke="#00e5a0" stroke-width="1" stroke-dasharray="10 6" opacity="0.45"/>

  <!-- Fake window chrome inside placeholder -->
  <g transform="translate(80, 380)">
    <circle cx="16" cy="16" r="10" fill="#fafafa" opacity="0.24"/>
    <circle cx="46" cy="16" r="10" fill="#fafafa" opacity="0.24"/>
    <circle cx="76" cy="16" r="10" fill="#fafafa" opacity="0.24"/>
    <rect x="120" y="6" width="500" height="20" rx="6" fill="rgba(255,255,255,0.06)"/>
  </g>

  <!-- Content-slot label inside the pane -->
  <text x="540" y="700" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="26" fill="#fafafa" opacity="0.32" letter-spacing="0.14em">
    PRODUCT DEMO CAPTURE
  </text>
  <text x="540" y="740" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="20" fill="#fafafa" opacity="0.24" letter-spacing="0.08em">
    dashboard · session grid · attendance · finance
  </text>

  <!-- Caption card · glass -->
  <rect x="40" y="1120" width="1000" height="230" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(0,229,160,0.25)" stroke-width="1"/>

  <!-- Caption headline -->
  <text x="80" y="1190" font-family="'Geist', 'Inter', sans-serif" font-weight="500" font-size="56" fill="#fafafa" letter-spacing="-0.02em">
    Sport OS for MENA-first academies.
  </text>
  <!-- Caption sub -->
  <text x="80" y="1250" font-family="'Geist', 'Inter', sans-serif" font-weight="400" font-size="30" fill="#fafafa" opacity="0.65">
    Arabic-first · Ramadan-aware · SAMA + FRA + ADGM ready.
  </text>

  <!-- CTA marker (rendered as underlined mono link · operator overlays actual URL) -->
  <text x="80" y="1310" font-family="'Geist Mono', ui-monospace, monospace" font-size="24" fill="#00e5a0" text-decoration="underline" letter-spacing="0.08em">
    → academorix.com
  </text>

  <!-- Bottom safe-zone marker -->
  <line x1="0" y1="1368" x2="1080" y2="1368" stroke="#fafafa" stroke-width="1" stroke-dasharray="6 6" opacity="0.14"/>

  <!-- f_ mark · bottom-right -->
  <g transform="translate(950, 1436)">
    <rect x="44" y="18" width="8" height="76" fill="#fafafa"/>
    <rect x="44" y="18" width="30" height="8" fill="#fafafa"/>
    <rect x="28" y="52" width="36" height="8" fill="#fafafa"/>
    <rect x="28" y="102" width="64" height="8" fill="#00e5a0"/>
  </g>
</svg>

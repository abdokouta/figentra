<?xml version="1.0" encoding="UTF-8"?>
<!--
  Illustration — section-divider.svg
  1200×80 horizontal divider. A hairline through the mid-line breaks
  around a small centred F-Cursor mark. Use between long-form
  marketing sections, between chapters in docs pages, and above
  footer regions. Neutral enough for either theme.
  See docs/brand/13-patterns-and-assets.md §Section divider.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="80" viewBox="0 0 1200 80">
  <style>
    svg { color: #141414; }
    @media (prefers-color-scheme: dark) {
      svg { color: #fafafa; }
    }
  </style>
  <!-- Left hairline -->
  <line x1="0" y1="40" x2="540" y2="40" stroke="currentColor" stroke-width="1" opacity="0.18"/>
  <!-- Right hairline -->
  <line x1="660" y1="40" x2="1200" y2="40" stroke="currentColor" stroke-width="1" opacity="0.18"/>

  <!-- Centre F-Cursor mark scaled to 40×40 -->
  <g transform="translate(580, 20) scale(0.33)">
    <g fill="currentColor">
      <rect x="30" y="24" width="10" height="72"/>
      <rect x="30" y="24" width="52" height="10"/>
      <rect x="30" y="56" width="34" height="10"/>
    </g>
    <rect x="88" y="26" width="14" height="6" fill="#00E5A0"/>
  </g>
</svg>

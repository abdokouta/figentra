<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icon — social-avatar.svg
  400×400 slightly-rounded square (rx=48) for LinkedIn, X, GitHub, and
  Slack workspace avatars. Tighter safe-area than the app-icon — the
  F+cursor fills more of the frame so it survives the platform's
  aggressive downscale to 40-80px.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <style>
    svg { color: #141414; }
    @media (prefers-color-scheme: dark) {
      svg { color: #fafafa; }
    }
  </style>
  <rect width="400" height="400" fill="currentColor" rx="48"/>
  <g fill="#fafafa">
    <rect x="90" y="76" width="34" height="248"/>
    <rect x="90" y="76" width="178" height="34"/>
    <rect x="90" y="184" width="118" height="34"/>
  </g>
  <rect x="288" y="86" width="48" height="20" fill="#00E5A0"/>
</svg>

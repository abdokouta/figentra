<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icon — favicon.svg
  Scalable 32×32 that holds up at 16, 32, and 48. Ink background,
  paper-white F, Signal-mint cursor. Ship this as the SVG favicon +
  export to .ico via the sharp-cli pipeline (see docs/brand/13-patterns-and-assets.md
  §Favicon export).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <style>
    svg { color: #141414; }
    @media (prefers-color-scheme: dark) {
      svg { color: #fafafa; }
    }
  </style>
  <rect width="32" height="32" fill="currentColor" rx="6"/>
  <rect x="8" y="7" width="4" height="18" fill="#fafafa"/>
  <rect x="8" y="7" width="14" height="4" fill="#fafafa"/>
  <rect x="8" y="15" width="10" height="4" fill="#fafafa"/>
  <rect x="24" y="8" width="5" height="2" fill="#00E5A0"/>
</svg>

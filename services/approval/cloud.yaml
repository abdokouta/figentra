# =============================================================================
# Figentra deployable manifest — approval service
# =============================================================================
#
# @file services/approval/cloud.yaml
# @description Declarative deployment contract for the approval NestJS service.
#   Terraform reads durable infrastructure requirements, Docker tooling reads
#   the container contract, and CI uses the branch/environment mapping.
#
# @ownership The service owns its runtime and business logic. This file only
#   describes deployment identity, infrastructure capabilities, routing,
#   observability, and safe non-secret configuration.
#
# @security Secrets MUST NOT be stored here. Use Doppler/runtime secret
#   injection for credentials, private keys, database URLs, tokens, and keys.
#
# @source-of-truth This file is the deployable manifest source of truth. Do not
#   duplicate these values in Terraform, Docker Compose, or CI by hand.
# =============================================================================

# Manifest discriminator consumed by the catalog collector.
kind: service

# Immutable workspace-unique deployable identifier.
slug: approval

# Product/operator brand that owns this deployable.
brand: figentra

# Platform plane containing the service boundary.
plane: control

# Runtime selected for the service. NestJS runs in a Cloudflare Container
# boundary behind the platform Gateway; the service itself remains Node.js.
runtime: cloudflare-container

# Deployment sharing tier. Shared means the service is platform infrastructure
# rather than a tenant-dedicated deployment.
tier: shared

# Repository source used by build/deployment automation.
source:
  # Source type tells the collector this is part of this monorepo.
  type: local
  # Canonical path relative to the repository root.
  path: services/approval

# Public hostname label when the service must be externally addressable.
# Internal-only services can omit this field in the future.
subdomain: approval

# Cloudflare Container/Worker identity. Must remain stable after provisioning.
cloudflare_name: figentra-approval

# Doppler project containing this deployable's runtime secrets/configuration.
doppler_project: figentra-approval

# Container process contract used by Docker and health checks.
container:
  # Fastify/Nest HTTP listener port inside the container.
  port: 3000
  # Liveness endpoint must not depend on external dependencies.
  health_path: /health/live
  # Readiness endpoint may check required dependencies.
  readiness_path: /health/ready

# Infrastructure capability modules consumed by this deployable.
# Each entry references a module from infrastructure/modules/ by name, pins a
# semver range, and supplies typed config validated at catalog-collection time.
# Replaces the legacy flat-boolean `capabilities:` block per the cloud.yaml
# capability-modules plan (2026-09-03).
modules:
  # ── Storage ────────────────────────────────────────────────────────────────
  - use: supabase-postgres
    version: "^1.0.0"
    config:
      database: approval
      engine_version: "16"
      pooler_mode: transaction

  # ── Messaging ──────────────────────────────────────────────────────────────
  - use: nats-jetstream
    version: "^1.0.0"
    config:
      consumer_group: approval-service
      streams:
        - name: approval-events
          subjects: ["approval.>"]
          retention: limits
          max_age: "72h"

  # ── Observability ──────────────────────────────────────────────────────────
  - use: sentry-project
    version: "^1.0.0"
    config:
      platform: node
      traces_sample_rate: 0.1

  - use: betterstack-uptime
    version: "^1.0.0"
    config:
      probe_url: /health/ready
      check_interval_seconds: 60

# Git branch promotion mapping. Production is never mapped to a developer branch.
branch:
  # Development branch deployed to the dev environment.
  development: develop
  # Staging branch deployed to staging.
  staging: staging
  # Protected production branch.
  production: main

# Safe, non-secret environment variables by environment.
env_vars:
  # Developer environment values.
  development:
    LOG_LEVEL: debug
    # Stable service identity used by NestJS Observe. Credentials are secrets.
    OBSERVE_SERVICE_ID: approval
  # Staging values.
  staging:
    LOG_LEVEL: info
    OBSERVE_SERVICE_ID: approval
    # Devtools HTTP remains disabled unless explicitly enabled for a protected environment.
    NEST_DEVTOOLS_HTTP: "false"
  # Production values.
  production:
    LOG_LEVEL: warn
    OBSERVE_SERVICE_ID: approval
    # Production never exposes the Devtools introspection HTTP server.
    NEST_DEVTOOLS_HTTP: "false"
    NEST_DEVTOOLS_SNAPSHOT: "false"

# Local Docker contract. Production runtime ownership remains Terraform/provider.
docker:
  # Enables inclusion in the generated local compose graph.
  enabled: true
  # Build context relative to repository root.
  context: .
  # Canonical service Dockerfile.
  dockerfile: services/approval/Dockerfile
  # Multi-stage target containing only production runtime artifacts.
  target: runtime
  # Container port exposed to the internal compose network.
  container_port: 3000
  # Shared local development network.
  network: figentra

# Observability integrations owned by the platform.
# NOTE: Sentry + BetterStack uptime are now declared as infrastructure modules
# in the `modules:` block above. Only NestJS-specific observability config
# (Observe + Devtools) remains here — these are app-runtime concerns, not
# infrastructure capabilities.
observability:
  # NestJS Observe is the primary Nest-native telemetry platform for requests,
  # jobs, errors, logs, traces, runtime metrics, and profiles.
  observe:
    enable: true
    service_id_env: OBSERVE_SERVICE_ID
    app_key_env: OBSERVE_APP_KEY
    app_secret_env: OBSERVE_APP_SECRET
    service_version_env: OBSERVE_SERVICE_VERSION
  # NestJS Devtools is an opt-in development/CI architecture introspection tool.
  devtools:
    enable: true
    http_default: false

# Searchable ownership/governance metadata.
tags:
  # Canonical service name.
  service: approval
  # Platform plane.
  plane: control
  # Owning organization.
  vendor: figentra

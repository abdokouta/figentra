# =============================================================================
# @file infrastructure/docker/catalog.yaml
# @description Docker generation contract.
#
# The root `cloud.yaml` is the only deployment-source enrollment manifest.
# Docker consumes the generated infrastructure/.generated/catalog.json and
# never performs independent filesystem discovery. Every generated artefact
# (catalog + compose) lives under infrastructure/.generated/ — machine-owned,
# gitignored, regenerated on demand.
# =============================================================================

kind: docker-catalog
version: 1
source:
  root_manifest: ../../cloud.yaml
  generated_catalog: ../.generated/catalog.json
  infrastructure: ./docker.yaml
output:
  compose: ../.generated/docker-compose.yml
environments:
  path: ./environments

# =============================================================================
# @file infrastructure/modules/firebase-fcm/module.yaml
# @description Firebase Cloud Messaging for push notifications.
#
# Machine-readable infrastructure module manifest. Validated against
# infrastructure/modules/schema/module.v1.json at CI time.
#
# @security No secrets. Env-var values come from Doppler at runtime;
#   this file only declares the contract (env-var names + source expressions).
# =============================================================================
name: firebase-fcm
version: "1.0.0"
kind: infrastructure-module
category: third-party
maturity: stable
description: Firebase Cloud Messaging for push notifications. Provisions a Firebase project + enables FCM; injects the server key and project ID for the mobile backend to send push tokens.
provides: ["push.fcm"]
consumes: []
runtime_targets:
  terraform: terraform.tf
  docker: null
  wrangler: null
schema:
  type: object
  properties:
    project_id:
      type: string
      description: GCP project ID for Firebase.
    android_package:
      type: string
      description: Android package name (e.g. com.figentra.family).
    ios_bundle_id:
      type: string
      description: iOS bundle ID (e.g. com.figentra.family).
env_vars:
  - name: FIREBASE_PROJECT_ID
    description: GCP project ID.
    source: module.config.project_id
  - name: FCM_SERVER_KEY
    description: FCM server key (from Doppler).
    source: terraform_output.fcm_server_key

# =============================================================================
# @file infrastructure/modules/cloudflare-kv/module.yaml
# @description Cloudflare Workers KV namespace binding.
#
# Machine-readable infrastructure module manifest. Validated against
# infrastructure/modules/schema/module.v1.json at CI time.
#
# @security No secrets. Env-var values come from Doppler at runtime;
#   this file only declares the contract (env-var names + source expressions).
# =============================================================================
name: cloudflare-kv
version: "1.0.0"
kind: infrastructure-module
category: cloudflare
maturity: stable
description: Cloudflare Workers KV namespace binding. Provisions a KV namespace per deployable and injects the namespace ID into the Worker runtime.
provides: ["cloudflare.kv"]
consumes: []
runtime_targets:
  terraform: terraform.tf
  docker: null
  wrangler: wrangler.jsonc.tmpl
schema:
  type: object
  properties:
    namespace_name:
      type: string
      pattern: "^[a-z][a-z0-9_-]{0,62}$"
      description: KV namespace name.
    ttl_seconds:
      type: integer
      minimum: 60
      default: 86400
      description: Default TTL for KV entries.
  required: ["namespace_name"]
env_vars:
  - name: KV_NAMESPACE_ID
    description: Cloudflare KV namespace UUID.
    source: terraform_output.kv_namespace_id
  - name: KV_NAMESPACE_NAME
    description: KV namespace name.
    source: module.config.namespace_name

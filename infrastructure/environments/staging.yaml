environment: staging
branch: staging
log_level: info
production: false
runtime:
  node: '24'
  http: fastify
  edge: cloudflare-workers
  messaging: nats
  event_stream: nats-jetstream
security:
  identity_provider: supabase
  authorization_authority: figentra-iam
  nats_tls_required: true
  manual_production_gate: false
external:
  doppler_config: stg
  wrangler_environment: staging
  terraform_workspace: staging
  docker_compose: true

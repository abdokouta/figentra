# =============================================================================
# EAS Workflow — @figentra/family  build + submit
# =============================================================================
#
# An Expo EAS Workflow (runs on EAS servers, not GitLab CI). It builds the iOS
# + Android production artifacts, then submits each to its store.
#
# Invoke:
#     doppler run --project figentra-family --config prd -- \
#         eas workflow:run .ci/family-build-submit.yml
#
# Why .ci/ (not .eas/workflows/)
#   Workspace convention keeps CI definitions under .ci/. EAS auto-triggers
#   `on:` events ONLY for workflows under `.eas/workflows/` (GitHub App). From
#   .ci/ this workflow is invoked explicitly (command above) or wired from the
#   platform pipeline. Move/symlink into `.eas/workflows/` to enable push
#   auto-trigger.
#
# Config + secrets (no hardcoding — spec 15 §9)
#   Build env  : EXPO_PUBLIC_* from eas.json build profiles (public, inlined).
#   Submit creds: eas.json submit profile references $APPLE_ID / $ASC_APP_ID /
#                 $APPLE_TEAM_ID / $GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_PATH — supplied
#                 from Doppler (figentra-family) via `doppler run` above, or from
#                 EAS project secrets. EXPO_TOKEN authenticates the EAS CLI.
#
# The EAS project itself is provisioned by Terraform (modules/expo); run
# `eas init --id <expo_app_id>` once before the first workflow run.
# =============================================================================

name: family-build-submit

on:
  push:
    branches:
      - main

jobs:
  build_ios:
    name: Build iOS (production)
    type: build
    params:
      platform: ios
      profile: production

  build_android:
    name: Build Android (production)
    type: build
    params:
      platform: android
      profile: production

  submit_ios:
    name: Submit iOS to App Store Connect
    needs: [build_ios]
    type: submit
    params:
      platform: ios
      profile: production

  submit_android:
    name: Submit Android to Google Play
    needs: [build_android]
    type: submit
    params:
      platform: android
      profile: production
